<!DOCTYPE html>
<html lang="fr">
<head>
    <script>
        if (localStorage.getItem('ensa_auth') !== 'true') {
            window.location.href = 'login.html';
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Eco - Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 2rem;
        }
        .container {
            background-color: #fff;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 1000px;
            margin: 0 auto;
        }
        h2 {
            margin-top: 0;
            color: #2c3e50;
            text-align: center;
            margin-bottom: 2rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #27ae60;
            color: white;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        .status-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: bold;
        }
        .status-nouveau { background-color: #e67e22; color: white; }
        .status-en-cours { background-color: #3498db; color: white; }
        .status-resolu { background-color: #2ecc71; color: white; }
    </style>
</head>
<body>

<div class="container">
    <h2>Tableau de Bord des Signalements</h2>
    <div style="width: 100%; max-width: 400px; margin: 0 auto 2rem auto;">
        <canvas id="statusChart"></canvas>
    </div>
    <table id="signalementsTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Type</th>
                <th>Location</th>
                <th>Description</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            <!-- Data will be inserted here -->
        </tbody>
    </table>
</div>

<script>
    window.onload = async function() {
        const tableBody = document.querySelector('#signalementsTable tbody');
        
        // Fetch All Signalements
        try {
            const response = await fetch('http://localhost:8080/api/signalements');
            if (!response.ok) throw new Error('Erreur lors de la récupération des signalements');
            
            const signalements = await response.json();
            signalements.forEach(sig => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${sig.id}</td>
                    <td>${sig.typeProbleme}</td>
                    <td>${sig.lieu}</td>
                    <td>${sig.description}</td>
                    <td><span class="status-badge status-${sig.statut.toLowerCase().replace(/\s+/g, '-')}">${sig.statut}</span></td>
                `;
                tableBody.appendChild(row);
            });
        } catch (error) {
            console.error('Error:', error);
            tableBody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:red;">Impossible de charger les signalements.</td></tr>`;
        }

        // Fetch and Render Stats Chart
        try {
            const response = await fetch('http://localhost:8080/api/signalements/stats');
            if (!response.ok) throw new Error('Erreur lors de la récupération des stats');
            
            const stats = await response.json();
            const labels = Object.keys(stats);
            const data = Object.values(stats);

            new Chart(document.getElementById('statusChart'), {
                type: 'pie',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: ['#e67e22', '#3498db', '#2ecc71']
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { position: 'bottom' },
                        title: { display: true, text: 'Répartition des Signalements' }
                    }
                }
            });
        } catch (error) {
            console.error('Stats Error:', error);
        }
    };
</script>

</body>
</html>
